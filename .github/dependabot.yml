version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # obsidian declares exact @codemirror/* peers, so these three have to
      # move in the same PR or npm refuses to install the result.
      obsidian:
        patterns:
          - "obsidian"
          - "@codemirror/*"
      # Everything else, majors included, arrives as one PR per week.
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; stay on ~6.0.x
      # until the support range moves.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    # Keep commitlint happy on dependabot PRs.
    commit-message:
      prefix: "build"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
