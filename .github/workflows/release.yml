name: Release

# Every push to main is analyzed by semantic-release: conventional commits
# decide whether (and how) to bump the version. When a release is due it
# updates package.json/manifest.json/versions.json/CHANGELOG.md, tags the
# commit, and publishes a GitHub release with the plugin files attached.
on:
  push:
    branches: [main]

# Releases are written with the RELEASE_TOKEN PAT. The default GITHUB_TOKEN
# gets no write access to the repository itself; the two extra scopes below
# are only what actions/attest-build-provenance needs to mint an attestation.
permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and release
    runs-on: self-hosted  # ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # semantic-release needs the full history to find the last release tag
          fetch-depth: 0
          # PAT with permission to push past main's branch protection; the
          # default GITHUB_TOKEN cannot bypass it.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      # Signed provenance for the two build outputs, so anyone can check a
      # download really came from this workflow: `gh attestation verify
      # main.js --repo bartekmp/obsidian-image-baker`. manifest.json is not
      # covered: semantic-release rewrites its version below, so its digest
      # here is not the one that gets published.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release
